<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <!---->
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --card: #fffdf8;
      --ink: #1f1a16;
      --muted: #6b625a;
      --accent: #c45c26;
      --line: #e6ded4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #fff8ee, var(--bg));
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .todo {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(80, 50, 20, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    li.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    li span {
      flex: 1;
    }

    li button {
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <section class="todo">
    <h1>Lista de tareas</h1>
    <p>Escribe una tarea y pulsa añadir.</p>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Nueva tarea..." required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="todo-list"></ul>
  </section>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const item = document.createElement("li");
      item.innerHTML = `
        <input type="checkbox" aria-label="Marcar como hecha">
        <span></span>
        <button type="button">Eliminar</button>
      `;
      item.querySelector("span").textContent = text;

      item.querySelector("input").addEventListener("change", (event) => {
        item.classList.toggle("done", event.target.checked);
      });

      item.querySelector("button").addEventListener("click", () => {
        item.remove();
      });

      list.appendChild(item);
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
